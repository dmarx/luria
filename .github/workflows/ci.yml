# Luria runs its own machinery on its own record (ADR-009), so this workflow is
# both the package's CI and the worked example the docs point at — including
# the docs jobs, which use the SAME composite actions adopters get
# (actions/generate, actions/lint), referenced by local path so a change to an
# action is exercised by the pull request that makes it (ADR-029). The
# template workflow `luria init` scaffolds is this shape with the actions
# pinned remotely.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly fragment collection. The only wrong cadence is "every merge" — a
    # per-merge bot commit races in-flight rebases (ADR-002).
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  # Where merges serialize, the views are regenerated, committed and pushed
  # as the bot; the lint then reads that commit (ADR-029). Generated views
  # are committed on main only (ADR-tmphzwg9): a pull request regenerates and
  # checks in one job and commits nothing, so branches never carry the
  # decision index or the devlog book, and two branches cannot conflict on
  # them.
  docs-generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.generate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: generate
        uses: ./actions/generate
        with:
          pip-spec: -e .
          # Concretize only where merges serialize (ADR-049).
          concretize: "true"

  # `needs:` + the sha output is the load-bearing handoff: a push made with
  # GITHUB_TOKEN does not retrigger workflows, so a lint reading any other
  # commit would fail on staleness the bot just repaired — or, worse, never
  # re-run to clear it.
  docs-lint:
    if: github.event_name == 'push'
    needs: docs-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs-generate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./actions/lint
        with:
          pip-spec: -e .

  # The pull-request shape: regenerate in the working tree, commit nothing,
  # lint the regenerated tree in the same job. The default checkout is the
  # merge commit, so the record is checked as it would land — and a fork
  # needs no write permission, because nothing is pushed.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./actions/generate
        with:
          pip-spec: -e .
          commit: "false"
      - uses: ./actions/lint
        with:
          pip-spec: ""

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  # `needs:` + the sha output is the load-bearing handoff: a push made with
  # GITHUB_TOKEN does not retrigger workflows, so a lint reading any other
  # commit would fail on staleness the bot just repaired — or, worse, never
  # re-run to clear it.
  docs-lint:
    if: github.event_name != 'schedule'
    needs: docs-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs-generate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./actions/lint
        with:
          pip-spec: -e .

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: luria collect --commit
      - run: git push
