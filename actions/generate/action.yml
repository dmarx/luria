name: luria docs generate
description: >-
  Regenerate luria's derived views (luria link --fix + luria index), commit and
  push any diff as github-actions[bot], and output the SHA a downstream
  checking job must read. On a fork PR nothing is pushed and the output SHA is
  the un-regenerated commit, so the staleness lint downstream fails
  informatively instead of this job dying on a 403.
inputs:
  pip-spec:
    description: >-
      pip requirement spec used to install luria (e.g. "luria==0.1.2", or
      "-e ." inside luria's own repository). Empty string skips the install
      for callers that installed it already.
    default: luria
  concretize:
    description: >-
      "true" runs `luria concretize` before the views regenerate, assigning
      real numbers to any merge-allocated temporary codes (LU-ADR-049). Pass
      true ONLY where merges serialize — the push-to-default-branch run —
      and never on pull-request runs: concretizing on a branch is exactly
      the premature number claim the temporary codes exist to avoid. A
      project with no merge-allocated schemes can pass true harmlessly; the
      command is a no-op with nothing pending.
    default: "false"
  commit-message:
    description: >-
      Commit message for the regenerated views. The default carries GitHub's
      skip marker so the bot's push does not trigger a fresh workflow run;
      keep that property if you override it.
    default: "docs: regenerate views [skip ci]"
outputs:
  sha:
    description: The commit the checking job must check out.
    value: ${{ steps.commit.outputs.sha }}
runs:
  using: composite
  steps:
    - if: ${{ inputs.pip-spec != '' }}
      shell: bash
      run: pip install ${{ inputs.pip-spec }}
    - if: ${{ inputs.concretize == 'true' }}
      shell: bash
      run: luria concretize
    - shell: bash
      run: luria link --fix
    - shell: bash
      run: luria index
    - id: commit
      shell: bash
      env:
        CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        MSG: ${{ inputs.commit-message }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "luria views already current — nothing to commit."
        elif [ "$CAN_PUSH" != "true" ]; then
          echo "::warning::luria views are stale and this is a fork PR — run 'luria index' and commit the result"
          git reset -q
        else
          git commit -m "$MSG"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - shell: bash
      run: luria index --check
    - if: ${{ inputs.concretize == 'true' }}
      shell: bash
      run: luria concretize --check
