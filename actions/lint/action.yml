# The checking half of the recommended docs workflow (ADR-029): the lint that
# gates what a generator cannot decide, plus the status reports uploaded where
# they can be read — which matters most when the lint failed.
#
# Caller contract: check out the SHA the generate action output (via `needs:`
# on the generation job), and set up Python first. Without that handoff this
# lint reads the pre-regeneration commit and fails on staleness the bot just
# repaired — a push made with GITHUB_TOKEN does not retrigger workflows, so
# that red never clears on its own.
name: luria docs lint
description: >-
  Run luria lint — unresolved references, wikilinks that resolve to nothing, a
  title disagreeing with its heading, stray files in a view directory, and
  stale generated views — then write and upload the status reports whether or
  not the lint passed.
inputs:
  pip-spec:
    description: >-
      pip requirement spec used to install luria. Empty string skips the
      install for callers that installed it already.
    default: luria
  reports-artifact:
    description: Artifact name for the status reports; empty string skips the upload.
    default: doc-reports
  reports-path:
    description: Where `luria reports` writes — your luria.toml's `reports` path.
    default: docs/reports
  skip-marker-range:
    description: >-
      Commit range scanned for skip markers written as prose — a message
      *describing* the convention carries the marker and so suppresses its own
      build. Empty string turns the check off. It needs history to read:
      `actions/checkout` fetches depth 1 by default, so give the checkout a
      `fetch-depth` that covers this range or the check has nothing to see.
    default: HEAD~20..HEAD
runs:
  using: composite
  steps:
    - if: ${{ inputs.pip-spec != '' }}
      shell: bash
      run: pip install ${{ inputs.pip-spec }}
    - shell: bash
      run: luria lint
    # The reports are committed views written by `luria index` (#35), but the
    # artifact regenerates them fresh: when the lint failed on staleness, the
    # committed copies are exactly what can't be trusted. always() keeps them
    # available when the lint failed, when they are most wanted.
    - if: ${{ always() }}
      shell: bash
      run: luria reports
    # Independent of the lint's verdict, so `always()`: a suppressed build is
    # worth reporting on the run that failed as much as on the one that
    # passed. Warns and does not fail — the marker is legitimate on the
    # commits that mean it, and only position distinguishes them.
    - if: ${{ always() && inputs.skip-marker-range != '' }}
      shell: bash
      run: luria skip-markers --rev-range "${{ inputs.skip-marker-range }}"
    - if: ${{ always() && inputs.reports-artifact != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.reports-artifact }}
        path: ${{ inputs.reports-path }}/
        if-no-files-found: warn
