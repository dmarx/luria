# The checking half of the recommended docs workflow (ADR-029): the lint that
# gates what a generator cannot decide, plus the status reports uploaded where
# they can be read — which matters most when the lint failed.
#
# Caller contract, in the two shapes (LU-ADR-068):
#   - On the default branch: check out the SHA the generate action output (via
#     `needs:` on the generation job), and set up Python first. Without that
#     handoff this lint reads the pre-regeneration commit and fails on
#     staleness the bot just repaired — a push made with GITHUB_TOKEN does not
#     retrigger workflows, so that red never clears on its own.
#   - On a pull request: run the generate action with `views: "false"` in
#     the SAME job, then this. The source repairs were pushed to the branch;
#     no view was written, and none is needed — the lint reads sources.
name: luria docs lint
description: >-
  Run luria lint — unresolved references, wikilinks that resolve to nothing, a
  title disagreeing with its heading, stray files in a view directory — then
  write and upload the status reports whether or not the lint passed.
inputs:
  pip-spec:
    description: >-
      pip requirement spec used to install luria. Empty string skips the
      install for callers that installed it already.
    default: luria
  reports-artifact:
    description: Artifact name for the status reports; empty string skips the upload.
    default: doc-reports
  reports-path:
    description: Where `luria reports` writes — your luria.toml's `reports` path.
    default: docs/reports
runs:
  using: composite
  steps:
    - if: ${{ inputs.pip-spec != '' }}
      shell: bash
      run: pip install ${{ inputs.pip-spec }}
    - shell: bash
      run: luria lint
    # The reports are committed views written by `luria index` (#35), but the
    # artifact regenerates them fresh: on a branch there is no committed copy
    # for this tree, and on the default branch the fresh one is the one to
    # read. always() keeps them available when the lint failed, when they are
    # most wanted.
    - if: ${{ always() }}
      shell: bash
      run: luria reports
    - if: ${{ always() && inputs.reports-artifact != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.reports-artifact }}
        path: ${{ inputs.reports-path }}/
        if-no-files-found: warn
