name: luria site build
description: >-
  Stage the record with `luria site` and build it with a pinned Quartz, into a
  directory of static HTML ready for actions/upload-pages-artifact.
inputs:
  pip-spec:
    description: >-
      pip requirement spec used to install luria (e.g. "luria==0.1.2", or
      "-e ." inside luria's own repository). Empty string skips the install
      for callers that installed it already.
    default: luria
  quartz-repo:
    description: The Quartz repository to build with.
    default: jackyzha0/quartz
  quartz-ref:
    description: >-
      The Quartz tag to pin. Bump it deliberately: `luria site` writes a
      quartz.config.ts against this version's plugin API, and v5 replaced
      that file with a YAML one.
    default: v4.5.2
  node-version:
    description: Node version. Quartz v4 requires 22 or newer.
    default: "22"
outputs:
  path:
    description: Directory of built HTML, for actions/upload-pages-artifact.
    value: ${{ steps.build.outputs.path }}
runs:
  using: composite
  steps:
    - if: ${{ inputs.pip-spec != '' }}
      shell: bash
      run: pip install ${{ inputs.pip-spec }}
    - shell: bash
      run: luria site --out "$RUNNER_TEMP/luria-site"
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.quartz-repo }}
        ref: ${{ inputs.quartz-ref }}
        path: .quartz-build
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: .quartz-build/package-lock.json
    - id: build
      shell: bash
      run: |
        set -euo pipefail
        rm -rf .quartz-build/content
        cp -r "$RUNNER_TEMP/luria-site/content" .quartz-build/content
        cp "$RUNNER_TEMP/luria-site/quartz.config.ts" .quartz-build/quartz.config.ts
        cp "$RUNNER_TEMP/luria-site/quartz.layout.ts" .quartz-build/quartz.layout.ts
        cp "$RUNNER_TEMP/luria-site/custom.scss" .quartz-build/quartz/styles/custom.scss
        cp -r "$RUNNER_TEMP/luria-site/static/." .quartz-build/quartz/static/
        cd .quartz-build
        npm ci
        ICON=""
        for candidate in "$RUNNER_TEMP"/luria-site/static/icon.*; do
          if [ -e "$candidate" ]; then ICON="$candidate"; break; fi
        done
        if [ -n "$ICON" ]; then
          node -e "
            const sharp = require('sharp');
            sharp('$ICON', { density: 384 })
              .resize(512, 512, { fit: 'contain',
                                  background: { r: 0, g: 0, b: 0, alpha: 0 } })
              .png()
              .toFile('quartz/static/icon.generated.png')
              .then(() => console.log('icon: rasterized $ICON'));
          "
          mv quartz/static/icon.generated.png quartz/static/icon.png
        fi
        npx quartz build --output "$RUNNER_TEMP/luria-site/public"
        echo "path=$RUNNER_TEMP/luria-site/public" >> "$GITHUB_OUTPUT"
