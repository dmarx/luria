[luria]
issue_url = "https://github.com/acme/research/issues/{n}"

[luria.schemes.NOTE]
dir    = "record/notes.d"
output = "docs/notes"

[luria.remotes.ARXIV]
name = "arXiv"
uid  = "(\\d{4})[.:](\\d{4,5})"
url  = "https://arxiv.org/abs/{1}.{2}"

[luria.remotes.JIRA]
name  = "Jira"
uid   = "[A-Z]+-\\d+"
delim = ":"
url   = "https://acme.atlassian.net/browse/{uid}"

[luria.remotes.CVE]
name = "CVE"
uid  = "\\d{4}-\\d{4,7}"
url  = "https://nvd.nist.gov/vuln/detail/CVE-{uid}"
