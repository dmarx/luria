# Luria as a citation linter for things that are not Luria records.
#
# A remote normally points at another project's record. Give it a `uid`
# pattern instead and the tail is an opaque identifier: matched exactly,
# never normalised, and turned into a URL through the template
# (LU-ADR-024). The prefix is the table's name, so the namespace is always
# explicit at the point of use.
[luria]
issue_url = "https://github.com/acme/research/issues/{n}"

[luria.schemes.NOTE]
dir    = "record/notes.d"
output = "docs/notes"

# `{0}` (or `{uid}`) is the whole tail; capture groups are positional from
# `{1}`. So ARXIV-2301.07041 → https://arxiv.org/abs/2301.07041
[luria.remotes.ARXIV]
name = "arXiv"
uid  = "(\\d{4})[.:](\\d{4,5})"
url  = "https://arxiv.org/abs/{1}.{2}"

# Ticket keys already contain a hyphen, so the delimiter moves out of the way:
# JIRA:PLAT-88 rather than JIRA-PLAT-88.
[luria.remotes.JIRA]
name  = "Jira"
uid   = "[A-Z]+-\\d+"
delim = ":"
url   = "https://acme.atlassian.net/browse/{uid}"

[luria.remotes.CVE]
name = "CVE"
uid  = "\\d{4}-\\d{4,7}"
url  = "https://nvd.nist.gov/vuln/detail/CVE-{uid}"
