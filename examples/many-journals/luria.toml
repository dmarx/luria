# Journals are a family, like schemes and remotes: you name them. Three here,
# each at the granularity its rate deserves — measure yours rather than
# copying these (LU-ADR-020).
#
# The test that decides journal vs fragment directory: do the sources
# survive? A journal's entries are dated observations that stay true, so they
# persist and the books are generated from them. A changelog fragment is
# consumed when collected.
[luria]
issue_url = "https://github.com/acme/platform/issues/{n}"

[luria.journals.devlog]
dir         = "record/devlog.d"
output      = "docs/devlog"
granularity = "month"
title       = "Development log"

[luria.journals.incidents]
dir         = "record/incidents.d"
output      = "docs/incidents"
granularity = "year"
title       = "Incident log"
blurb       = "What broke, what we thought was breaking, and what actually was."

[luria.journals.meetings]
dir         = "record/meetings.d"
output      = "docs/meetings"
granularity = "day"
title       = "Meeting notes"

# Published as a section of luria's own site (`site.include_records`), staged
# by this config rather than the parent's. The title is what names the section;
# without it the site falls back to the repository in `issue_url`, which for an
# example is either a fiction or the wrong project.
[luria.site]
title = "Many journals"

# This example is about journals, and left its scheme to the shipped default
# — which stopped being enough when `status:` became a field a scheme
# declares rather than one the code assumes (LU-#181). Written out so the
# words this record's decisions may use are this record's to see and change.
[luria.schemes.ADR]
dir = "record/decisions.d"
output = "docs/decisions"
active = "Active"
render = "index"

# `status:` declared as the controlled vocabulary it is (#181),
# written by `luria upgrade statuses`.
[luria.schemes.ADR.fields.status]
vocabulary = "statuses"
