vocabularies:
  adr-statuses:
    Active:
      blurb: in force — the current answer, and what a citation should normally point at
    Proposed:
      blurb: not in force yet — an open question, so citing it as settled is what the reference report
        catches
    Deferred:
      blurb: not in force and not being worked on; the question is real and the answer waits on something
    Superseded:
      blurb: no longer in force because something replaced it; the successor is named in the field, not
        in the prose
    Rejected:
      blurb: no longer in force and nothing replaced it — kept because a rejection is worth being able
        to point at
issue_url: https://github.com/acme/platform/issues/{n}
journals:
  devlog:
    dir: record/devlog.d
    output: docs/devlog
    granularity: month
    title: Development log
  incidents:
    dir: record/incidents.d
    output: docs/incidents
    granularity: year
    title: Incident log
    blurb: What broke, what we thought was breaking, and what actually was.
  meetings:
    dir: record/meetings.d
    output: docs/meetings
    granularity: day
    title: Meeting notes
site:
  title: Many journals
schemes:
  ADR:
    dir: record/decisions.d
    output: docs/decisions
    active: Active
    render: index
    fields:
      status:
        vocabulary: adr-statuses
    statuses: adr-statuses
