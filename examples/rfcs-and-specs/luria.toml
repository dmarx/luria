# Two document families side by side, and neither of them is a decision.
#
# The prefix is the table's name, so `RFC-7` and `SPEC-3` become first-class
# references the moment these tables exist: `luria link --fix` writes their
# links, `luria lint` demands them, and `luria new rfc` scaffolds the next
# free number.
[luria]
issue_url = "https://github.com/acme/widgets/issues/{n}"

# Browsed one at a time → an index plus per-tag pages.
[luria.schemes.RFC]
dir    = "record/rfcs.d"
output = "docs/rfcs"
render = "index"

# Read as a whole → one concatenated document. Same convention either way;
# only the reading changes (LU-ADR-012).
[luria.schemes.SPEC]
dir    = "record/specs.d"
output = "docs/interfaces.md"
render = "document"

# There is no ADR table here, so there is no ADR scheme: a declared `schemes`
# family replaces the shipped defaults rather than merging into them
# (LU-ADR-047). This record is RFCs and SPECs, and nothing else renders.

# Published as a section of luria's own site (`site.include_records`), staged
# by this config rather than the parent's. The title is what names the section;
# without it the site falls back to the repository in `issue_url`, which for an
# example is either a fiction or the wrong project.
[luria.site]
title = "RFCs and specs"
