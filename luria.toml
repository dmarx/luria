# Luria's own configuration — this repo runs its own machinery on its own
# record, which is the only way the machinery gets exercised before a consumer
# hits the bug (DP-6).
[luria]
issue_url = "https://github.com/dmarx/luria/issues/{n}"

# The read/write boundary (ADR-021): `docs/` is where a reader browses —
# prose plus every generated view — and `record/` is where a contributor
# files — every source, each container carrying the `.d` suffix that marks
# "fragments live here". Nothing under a view directory is hand-written.
[luria.paths]
docs = "docs"
decisions = "record/decisions.d"
design_principles = "docs/design-principles.md"
reports = "build/doc-reports"

# The changelog assembles in the release shape (ADR-028): each collection is a
# dated batch inserted right after the marker, newest first — the reading
# order a changelog owes its reader, where the narrative append style would
# bury the latest release at the bottom.
[luria.fragments."record/changelog.d"]
file = "CHANGELOG.md"
style = "changelog"

# The devlog is a journal, not a fragment directory: its entries are dated
# observations that stay true, so they persist and the books are generated from
# them (ADR-020). A month is the right book size for this repo's rate; measure
# yours before copying the number.
[luria.journals.devlog]
dir = "record/devlog.d"
output = "docs/devlog"
granularity = "month"
title = "Development log"
blurb = """The narrative that doesn't fit a changelog entry: root-cause \
archaeology, failed approaches, verification details, and the traps the next \
person would otherwise rediscover. Generated from the entries in \
`record/devlog.d/` — file one with `luria journal new "A title"`."""

[luria.code]
globs = ["luria/*.py", "tests/*.py", "Makefile", ".github/workflows/*.yml",
         "actions/**/*.yml", "template/**/*.yml",
         "template/**/*.md", "template/**/*.stub"]
historical = ["CHANGELOG.md"]

[luria.schemes.ADR]
dir = "record/decisions.d"
output = "docs/decisions"
active = "Active"
render = "index"

# Principles are read as a whole, not browsed one at a time, so their view is a
# document rather than a table (ADR-012). Same fragment convention either way.
[luria.schemes.DP]
dir = "record/principles.d"
active = "Active"
render = "document"
output = "docs/design-principles.md"

# Other projects' records, cited from this one. A reference composes the prefix
# with that project's own code — `SG-ADR-032`, `LU-ADR-013` — so the namespace
# is explicit and nothing has to guess which project an unprefixed code meant
# (ADR-016).

# strata-g: the pilot this package was extracted from, and still the source of
# most of its evidence. Its links resolve on the code-only convention, which is
# what strata-g will use once its record is ported to Luria — until then they
# are named-and-not-yet-followable, deliberately (ADR-017). `luria remotes
# --check` reports them as unverifiable, because the repository is private.
[luria.remotes.SG]
name = "strata-g"
repo = "dmarx/strata-g"
ref  = "main"
dir  = "docs/decisions"

# Its principles are a document-rendered scheme — sections of one file, not
# files — so DP codes construct a document anchor rather than a filename
# (ADR-023). The anchor template stays on the default (`dp-{number}`), which
# is right for current conventions and wrong for strata-g's legacy
# heading-derived anchors: the one DP citation in this record therefore keeps
# its `url-ok`, now excusing only the anchor.
[luria.remotes.SG.schemes.DP]
document = "docs/design-principles.md"

# Luria itself, registered on purpose: it is what the `template/` scaffold
# cites, so the remote machinery is exercised by this repo rather than only by
# its tests. Public and already on the code-only convention, so `luria remotes
# --check` verifies it for real.
[luria.remotes.LU]
name = "luria"
repo = "dmarx/luria"
ref  = "main"
dir  = "record/decisions.d"

# Dogfood for the document construction against a repository `luria remotes
# --check` can actually verify: LU-DP-9 → …/docs/design-principles.md#dp-9.
[luria.remotes.LU.schemes.DP]
document = "docs/design-principles.md"
