[luria]
issue_url = "https://github.com/dmarx/luria/issues/{n}"

[luria.paths]
docs = "docs"
decisions = "record/decisions.d"
design_principles = "docs/design-principles.md"
reports = "docs/reports"

[luria.fragments."record/changelog.d"]
file = "CHANGELOG.md"
style = "changelog"

[luria.journals.devlog]
dir = "record/devlog.d"
output = "docs/devlog"
granularity = "month"
title = "Development log"
blurb = """The narrative that doesn't fit a changelog entry: root-cause \
archaeology, failed approaches, verification details, and the traps the next \
person would otherwise rediscover. Generated from the entries in \
`record/devlog.d/` — file one with `luria new`."""

[luria.site]
exclude = ["template/**", "examples/**"]
icon = "assets/branding/luria-brainslug/luria_project_memory_icon.svg"
logo = "assets/branding/luria-brainslug/luria_project_memory_lockup_horizontal.svg"

[luria.site.theme.light]
light = "#f4f1e8"
lightgray = "#dcd5c3"
gray = "#8f8a7c"
darkgray = "#3a3630"
dark = "#111111"
secondary = "#2e5c62"
tertiary = "#7d9e94"
highlight = "rgba(46, 92, 98, 0.10)"
textHighlight = "#e8d99a88"

[luria.site.theme.dark]
light = "#151412"
lightgray = "#33302a"
gray = "#7a746a"
darkgray = "#d8d3c6"
dark = "#f4f1e8"
secondary = "#9dbfb4"
tertiary = "#7d9e94"
highlight = "rgba(157, 191, 180, 0.14)"
textHighlight = "#a8912d66"

[luria.code]
globs = ["luria/*.py", "tests/*.py", ".github/workflows/*.yml",
         "actions/**/*.yml", "template/**/*.yml",
         "template/**/*.md", "template/**/*.stub"]
historical = ["CHANGELOG.md"]

[luria.schemes.ADR]
dir = "record/decisions.d"
output = "docs/decisions"
active = "Active"
render = "index"
allocate = "merge"

[luria.schemes.DP]
dir = "record/principles.d"
active = "Active"
render = "document"
output = "docs/design-principles.md"
allocate = "merge"


[luria.remotes.SG]
name = "strata-g"
repo = "dmarx/strata-g"
ref  = "main"
dir  = "docs/decisions"

[luria.remotes.SG.schemes.DP]
document = "docs/design-principles.md"

[luria.remotes.LU]
name = "luria"
repo = "dmarx/luria"
ref  = "main"
dir  = "record/decisions.d"

[luria.remotes.LU.schemes.DP]
document = "docs/design-principles.md"

[luria.remotes.FX]
name = "fixtures"
url  = "https://github.com/dmarx/luria/blob/main/docs/directives.md#fixture-codes"
