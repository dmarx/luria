# Luria's own configuration — this repo runs its own machinery on its own
# record, which is the only way the machinery gets exercised before a consumer
# hits the bug (DP-6).
[luria]
issue_url = "https://github.com/dmarx/luria/issues/{n}"

[luria.paths]
docs = "docs"
decisions = "docs/decisions"
design_principles = "docs/design-principles.md"
reports = "build/doc-reports"

[luria.fragments]
"changelog.d" = "CHANGELOG.md"
"devlog.d" = "docs/devlog.md"

[luria.code]
globs = ["luria/*.py", "tests/*.py", "Makefile", ".github/workflows/*.yml",
         "template/**/*.md", "template/**/*.stub"]
historical = ["CHANGELOG.md", "docs/devlog.md"]

[luria.schemes.ADR]
dir = "docs/decisions"
active = "Active"
render = "index"

# Principles are read as a whole, not browsed one at a time, so their view is a
# document rather than a table (ADR-012). Same fragment convention either way.
[luria.schemes.DP]
dir = "docs/principles"
active = "Active"
render = "document"
output = "docs/design-principles.md"

# Another project's record, cited from this one. A reference composes the
# prefix with that project's own code — `LU-ADR-013` — so the namespace is
# explicit and nothing has to guess which project an unprefixed code meant
# (ADR-016).
#
# `LU` is Luria itself, registered on purpose: it is what the `template/`
# scaffold cites, and it means the remote machinery is exercised end to end by
# this repo rather than only by its tests. `luria remotes --check` verifies it.
[luria.remotes.LU]
name = "luria"
repo = "dmarx/luria"
ref  = "main"
dir  = "docs/decisions"
