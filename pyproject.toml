[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "luria"
dynamic = ["version"]
description = "A project's memory: decisions, principles, changelog and devlog, kept honest by lint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "fire>=0.7"]
keywords = ["adr", "architecture-decision-records", "documentation", "lint",
            "project-memory", "changelog", "devlog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "dmarx" }]

[project.urls]
Homepage = "https://github.com/dmarx/luria"
Repository = "https://github.com/dmarx/luria"
Issues = "https://github.com/dmarx/luria/issues"
Changelog = "https://github.com/dmarx/luria/blob/main/CHANGELOG.md"

[project.scripts]
luria = "luria.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["luria"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "luria/template"

[tool.hatch.build.targets.sdist]
include = ["luria", "template", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.version]
source = "vcs"

