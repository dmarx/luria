[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luria"
version = "0.1.0"
description = "A project's memory: decisions, principles, changelog and devlog, kept honest by lint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.scripts]
luria = "luria.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["luria"]

[tool.setuptools.package-data]
# The template ships with the package so `luria init` works from an install,
# not only from a checkout.
luria = ["../template/**/*"]
