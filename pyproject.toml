[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "luria"
dynamic = ["version"]
description = "A project's memory: decisions, principles, changelog and devlog, kept honest by lint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "fire>=0.7"]
keywords = ["adr", "architecture-decision-records", "documentation", "lint",
            "project-memory", "changelog", "devlog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "dmarx" }]

[project.urls]
Homepage = "https://github.com/dmarx/luria"
Documentation = "https://dmarx.github.io/luria/"
Repository = "https://github.com/dmarx/luria"
Issues = "https://github.com/dmarx/luria/issues"
Changelog = "https://github.com/dmarx/luria/blob/main/CHANGELOG.md"

[project.scripts]
luria = "luria.cli:main"

[project.optional-dependencies]
# `markdown-it-py` is here because this package GENERATES markdown, and the
# thing that broke was a markdown parsing rule: a `<tag>` sharing its line
# with content is a paragraph, not an HTML block, so a data island written
# that way came back from the site build with its quotes curled and its
# `</script>` moved. Asserting the shape by hand would only re-encode my
# reading of the spec; a CommonMark parser is the instrument. Quartz builds
# on remark/micromark, CommonMark-compliant on exactly this rule.
dev = ["pytest>=8", "build>=1", "markdown-it-py>=3"]
# `-block` scope asks a language question — where does the block below this
# comment end? — that a run of non-blank lines can only guess at. A grammar
# answers it for every language it has, which is why this is one extra and not
# a list of them. Optional: without it the guess is what luria has always
# used, and the grammar can only widen what a directive governs, never narrow
# it. The pack fetches a grammar bundle on first use and caches it; a lint
# that cannot reach it falls back rather than failing.
#
# The upper bound is measured, not defensive. On `tree-sitter` 0.26.0, walking
# parsed trees corrupts the heap: ~25 lines using nothing but the pack — one
# grammar, a cursor walk over this repository's own `.py` files — segfault
# reproducibly, and the crash surfaces later, in whatever allocates next.
# 0.25.2 runs the same script clean. Raise the ceiling by rerunning it, not by
# reading a changelog.
syntax = ["tree-sitter>=0.23,<0.26", "tree-sitter-language-pack>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["luria"]

# The scaffold ships INSIDE the package namespace (`luria/template/`), while
# staying top-level in the repository where a visitor browses it (ADR-021).
# The previous setuptools config leaked a bare `template/` into site-packages,
# where it would collide with any other package shipping one (ADR-027).
[tool.hatch.build.targets.wheel.force-include]
"template" = "luria/template"

[tool.hatch.build.targets.sdist]
# Everything a wheel build or a vendoring user needs; the record itself stays
# on GitHub — an sdist is a build input, not a browsing surface.
include = ["luria", "template", "tests", "README.md", "LICENSE", "pyproject.toml"]

# The version is derived from the release tag rather than written here, so the
# two cannot drift. `hatch-vcs` reads `git describe`, which is why the publish
# checkout fetches tags — at the default depth there is nothing to describe
# against and the version would silently become a `0.1.dev…` fallback.
#
# The guard added in #93 stays: deriving the version stops the drift, and the
# assertion is what makes a recurrence loud rather than a PyPI rejection after
# the environment gate.
[tool.hatch.version]
source = "vcs"

# No `[tool.hatch.build.hooks.vcs]` version file on purpose: nothing in the
# package reads its own version, and writing one out would reintroduce exactly
# the hand-maintained copy this removes.
