# The record's own CI. Two jobs: a lint that can fail, and a collection that
# runs on a cadence rather than per-merge (ADR-002 — a per-merge bot commit
# races in-flight rebases, reintroducing the conflict fragments exist to remove).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly collection. Adjust to taste; the only wrong answer is "every merge".
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install luria
      - run: luria lint
      # The status reports are warnings, so they never fail this job — which is
      # exactly why they need somewhere to be read. `if: always()` keeps them
      # available when the lint failed, which is when they are most wanted.
      - name: Status reports
        if: always()
        run: luria reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-reports
          path: build/doc-reports/
          if-no-files-found: warn

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install luria
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: luria collect --commit
      - run: git push
