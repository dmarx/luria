name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  docs-generate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.generate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: generate
        uses: dmarx/luria/actions/generate@main
        with:
          concretize: ${{ github.event_name != 'pull_request' }}

  docs-lint:
    if: github.event_name != 'schedule'
    needs: docs-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docs-generate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dmarx/luria/actions/lint@main

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install luria
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: luria collect --commit
      - run: git push
