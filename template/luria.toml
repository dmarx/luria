# Luria configuration. Every key has a default, so the only one most projects
# need is `issue_url` — without it, issue numbers stay bare rather than linking
# somewhere wrong.
[luria]
issue_url = ""

[luria.paths]
docs = "docs"
decisions = "docs/decisions"
design_principles = "docs/design-principles.md"
reports = "build/doc-reports"

# Fragment directory → the file it is collected into. Links written in a
# fragment resolve from the collected file's directory, not the fragment's
# (ADR-005), so this mapping is load-bearing, not just bookkeeping.
[luria.fragments]
"changelog.d" = "CHANGELOG.md"
"devlog.d" = "docs/devlog.md"

# Source files to scan for references to retired decisions. A decision number in
# a code comment is the strongest form of the claim being checked — it is the
# stated reason the code is shaped that way — so include the code you care about.
[luria.code]
globs = []
# Dated records: true about the day they were written, forever. Scanning them
# produces permanent, unactionable noise.
historical = ["CHANGELOG.md", "docs/devlog.md"]

# A referable document family: a prefix, a directory, the status that means "in
# force", and how its view is rendered — `index` when the documents are browsed
# and read one at a time, `document` when the set is read as a whole (ADR-012).
# Add another (RFC, SPEC) as a third entry; nothing else needs to change.
[luria.schemes.ADR]
dir = "docs/decisions"
active = "Active"
render = "index"

[luria.schemes.DP]
dir = "docs/principles"
active = "Active"
render = "document"
output = "docs/design-principles.md"

# Another project's record, cited from this one. `SG-ADR-032` then means that
# project's ADR-032: the fixer links it, the lint demands it, and
# `luria remotes --refresh` discovers filenames a code alone can't compute.
# Uncomment and edit — the prefix is yours to choose.
#
# [luria.remotes.SG]
# name = "strata-g"
# repo = "owner/name"
# ref  = "main"
# dir  = "docs/decisions"
# path = "../strata-g"     # optional local clone; the only way a private
#                          # remote's filenames can be discovered
